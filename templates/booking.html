<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SwiftDrop — Fast & Reliable Courier Delivery</title>
  <meta name="description" content="SwiftDrop delivers parcels, documents, and freight quickly and securely across cities and nationwide." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef6ff',
              100: '#d9ebff',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af',
              900: '#172554'
            }
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased">
    
    <section id="booking-section" class="bg-white py-16">
        <div class="mx-auto max-w-3xl px-4 sm:px-6 lg:px-8">
            <nav
                aria-label="Breadcrumb"
                class="border-b border-slate-200 bg-white mb-5"
                >
                <div class="max-w-7xl py-3">
                    <ol class="flex items-center gap-2 text-sm">
                    <li class="flex items-center gap-2">
                        <a
                        href="/"
                        class="flex items-center gap-1.5 font-medium text-slate-600 transition hover:text-brand-600"
                        >
                        <svg
                            class="h-4 w-4"
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                            aria-hidden="true"
                        >
                            <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"
                            />
                        </svg>
        
                        Home
                        </a>
                    </li>
        
                    <li aria-hidden="true" class="text-slate-400">
                        /
                    </li>
        
                    <li>
                        <span
                        aria-current="page"
                        class="font-semibold text-slate-900"
                        >
                        Book delivery
                        </span>
                    </li>
                    </ol>
                </div>
            </nav>
    <h2 class="text-3xl font-extrabold text-slate-900">
      Complete your delivery booking
    </h2>


    <div class="mt-6 rounded-2xl border border-brand-100 bg-brand-50 p-5">
      <p class="text-sm font-semibold text-brand-700">Selected quote</p>
      <p id="booking-price" class="mt-1 text-2xl font-extrabold text-brand-900"></p>
      <p id="booking-route" class="mt-1 text-sm text-brand-700"></p>
    </div>

    <form id="booking-form" class="mt-8 space-y-5">
      <div class="grid gap-5 sm:grid-cols-2">
        <input
          name="sender_name"
          placeholder="Sender full name"
          class="w-full rounded-lg border border-slate-300 px-4 py-3"
        />
        <input
          name="sender_phone"
          placeholder="Sender phone number"
          class="w-full rounded-lg border border-slate-300 px-4 py-3"
        />

        <input
          name="receiver_name"
          placeholder="Receiver full name"
          class="w-full rounded-lg border border-slate-300 px-4 py-3"
        />
        <input
          name="receiver_phone"
          placeholder="Receiver phone number"
          class="w-full rounded-lg border border-slate-300 px-4 py-3"
        />
      </div>

      <textarea
        name="pickup_address"
        id="pickup_address"
        rows="2"
        placeholder="Full pickup address"
        class="w-full rounded-lg border border-slate-300 px-4 py-3"
      ></textarea>

      <textarea
        name="destination_address"
        id="destination_address"
        rows="2"
        placeholder="Full destination address"
        class="w-full rounded-lg border border-slate-300 px-4 py-3"
      ></textarea>

      <input
        name="parcel_description"
        placeholder="What are you sending?"
        class="w-full rounded-lg border border-slate-300 px-4 py-3"
      />

      <div class="grid gap-5 sm:grid-cols-2">
        <input
          name="pickup_date"
          type="date"
          class="w-full rounded-lg border border-slate-300 px-4 py-3"
        />
        <select
          name="pickup_time_window"
          class="w-full rounded-lg border border-slate-300 px-4 py-3"
        >
          <option value="09:00-12:00">9:00 AM - 12:00 PM</option>
          <option value="12:00-15:00">12:00 PM - 3:00 PM</option>
          <option value="15:00-18:00">3:00 PM - 6:00 PM</option>
        </select>
      </div>

      <!-- <button
        type="submit"
        class="w-full rounded-xl bg-brand-600 px-6 py-4 font-semibold text-white transition hover:bg-brand-700"
      >
        Create booking
      </button> -->

        <button
            id="create-booking-button"
            type="submit"
            class="w-full inline-flex items-center justify-center gap-3 rounded-xl bg-brand-600 px-6 py-4 font-semibold text-white transition hover:bg-brand-700 disabled:cursor-not-allowed disabled:opacity-70"
            >
            <svg
                id="booking-spinner"
                class="hidden h-5 w-5 animate-spin"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
                />
                <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
                />
            </svg>

            <span id="create-booking-button-text">Create booking</span>
        </button>

    </form>

    <div
        id="booking-error"
        class="hidden rounded-2xl border border-red-200 bg-red-50 p-4 text-sm font-medium text-red-700"
        >
    </div>
    
    <div
        id="booking-confirmation"
        class="hidden rounded-3xl border border-emerald-200 bg-emerald-50 p-6 sm:p-8 mt-5"
        >
        <div class="flex items-center gap-3">
            <span
            class="flex h-10 w-10 items-center justify-center rounded-full bg-emerald-500 text-white"
            >
            ✓
            </span>

            <div>
            <h3 class="text-xl font-extrabold text-emerald-900">
                Booking created
            </h3>
            <p class="text-sm text-emerald-700">
                Your delivery request has been received.
            </p>
            </div>
        </div>

        <div class="mt-6 grid gap-4 sm:grid-cols-2">
            <!-- <div class="rounded-2xl bg-white p-4">
            <p class="text-xs font-semibold uppercase text-slate-500">
                Tracking number
            </p>
            <p
                id="confirmation-tracking-number"
                class="mt-1 text-lg font-extrabold text-slate-900"
            ></p>
            </div> -->

            <div class="rounded-2xl bg-white p-4">
                <p class="text-xs font-semibold uppercase text-slate-500">
                    Tracking number
                </p>

                <div class="mt-1 flex items-center justify-between gap-3">
                    <p
                    id="confirmation-tracking-number"
                    class="text-lg font-extrabold break-all text-slate-900"
                    ></p>

                    <button
                    id="copy-tracking-button"
                    type="button"
                    aria-label="Copy tracking number"
                    class="flex shrink-0 items-center gap-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600"
                    >
                    <svg
                        class="h-4 w-4"
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                        aria-hidden="true"
                    >
                        <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
                        />
                    </svg>

                    <span id="copy-tracking-button-text">Copy</span>
                    </button>
                </div>
            </div>

            <div class="rounded-2xl bg-white p-4">
            <p class="text-xs font-semibold uppercase text-slate-500">
                Estimated price
            </p>
            <p
                id="confirmation-price"
                class="mt-1 text-lg font-extrabold text-slate-900"
            ></p>
            </div>

            <div class="rounded-2xl bg-white p-4">
            <p class="text-xs font-semibold uppercase text-slate-500">
                Distance
            </p>
            <p
                id="confirmation-distance"
                class="mt-1 text-lg font-extrabold text-slate-900"
            ></p>
            </div>

            <div class="rounded-2xl bg-white p-4">
            <p class="text-xs font-semibold uppercase text-slate-500">
                Estimated arrival
            </p>
            <p
                id="confirmation-arrival"
                class="mt-1 text-lg font-extrabold text-slate-900"
            ></p>
            </div>
        </div>

        <div class="mt-6 flex flex-col gap-3 sm:flex-row">
            <a
            id="track-booking-link"
            href="#"
            class="w-full rounded-xl bg-brand-600 px-6 py-3 text-center font-semibold text-white transition hover:bg-brand-700 sm:w-auto"
            >
            Done!
            </a>
            <button
                id="track-booking-button"
                class="w-full rounded-xl bg-brand-600 px-6 py-3 text-center font-semibold text-white transition hover:bg-brand-700 sm:w-auto"
                >
                Track this delivery
            </button>

            <!-- <button
            id="new-booking-button"
            type="button"
            class="w-full rounded-xl border border-slate-300 bg-white px-6 py-3 text-center font-semibold text-slate-700 transition hover:bg-slate-50 sm:w-auto"
            >
            Create another booking
            </button> -->
        </div>
    </div>

    </div>


</section>
    <script>

        const bookingForm = document.getElementById("booking-form");
        const createBookingButton = document.getElementById("create-booking-button");
        const createBookingButtonText = document.getElementById(
        "create-booking-button-text"
        );
        const bookingSpinner = document.getElementById("booking-spinner");
        const bookingError = document.getElementById("booking-error");

        const bookingConfirmation = document.getElementById("booking-confirmation");
        const confirmationTrackingNumber = document.getElementById(
        "confirmation-tracking-number"
        );
        const confirmationPrice = document.getElementById("confirmation-price");
        const confirmationDistance = document.getElementById("confirmation-distance");
        const confirmationArrival = document.getElementById("confirmation-arrival");
        const trackBookingLink = document.getElementById("track-booking-link");
        const newBookingButton = document.getElementById("new-booking-button");

        function formatDuration(totalMinutes) {
        const minutes = Math.round(totalMinutes);
        const days = Math.floor(minutes / (60 * 24));
        const hours = Math.floor((minutes % (60 * 24)) / 60);
        const remainingMinutes = minutes % 60;

        if (days > 0) {
            return `${days} day${days === 1 ? "" : "s"}${
            hours ? ` ${hours} hour${hours === 1 ? "" : "s"}` : ""
            }`;
        }

        if (hours > 0) {
            return `${hours} hour${hours === 1 ? "" : "s"}${
            remainingMinutes ? ` ${remainingMinutes} minutes` : ""
            }`;
        }

        return `${minutes} minute${minutes === 1 ? "" : "s"}`;
        }

        function setBookingLoading(isLoading) {
        createBookingButton.disabled = isLoading;
        createBookingButton.setAttribute(
            "aria-busy",
            isLoading ? "true" : "false"
        );

        bookingSpinner.classList.toggle("hidden", !isLoading);

        createBookingButtonText.textContent = isLoading
            ? "Creating booking..."
            : "Create booking";
        }

        function showBookingError(message) {
            bookingError.textContent = message;
            bookingError.classList.remove("hidden");
        }

        function hideBookingError() {
            bookingError.classList.add("hidden");
        }
        
        const savedQuote = JSON.parse(
            sessionStorage.getItem("easygo_quote") || "null"
        );

        if (!savedQuote) {
        window.location.href = "/";
        } else {
        document.getElementById("booking-price").textContent =
            `$${Number(savedQuote.estimated_price).toLocaleString()}`;

        document.getElementById("booking-route").textContent =
            `${savedQuote.pickup_address} → ${savedQuote.destination_address}`;
        }

        document.getElementById("pickup_address").value = savedQuote.pickup_address
        document.getElementById("destination_address").value = savedQuote.destination_address

        document
        .getElementById("booking-form")
        .addEventListener("submit", async function (event) {
            event.preventDefault();

            if (!savedQuote) {
            showBookingError(
                "No valid quote was found. Please calculate a quote first."
                );
                return;
            }

            hideBookingError();
            setBookingLoading(true);
            
            try {
                const formData = new FormData(event.target);
                const bookingData = Object.fromEntries(formData.entries());

                console.log("Booking data to be sent:", bookingData);

                const response = await fetch("/api/bookings/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                },
                body: JSON.stringify({
                    ...bookingData,
                    weight_kg: savedQuote.weight_kg,
                    service_type: savedQuote.service_type,
                    estimated_price: savedQuote.estimated_price,
                    distance_km: savedQuote.distance_km,
                }),
                });

                const data = await response.json();
                console.log("Response from server:", data);

                

                // if (!response.ok) {
                // alert(data.error || data.non_field_errors[0] || "Unable to create booking.");
                // return;
                // }

                if (!response.ok) {
                    const message =
                        data.error || data.non_field_errors[0] ||
                        "Unable to create booking.";

                    throw new Error(message);
                }

                // Fill the confirmation card
                confirmationTrackingNumber.textContent = data.tracking_number;
                confirmationPrice.textContent = `$${Number(
                data.estimated_price
                ).toLocaleString()}`;

                confirmationDistance.textContent = `${data.distance_km} km`;

                confirmationArrival.textContent = formatDuration(
                data.estimated_delivery_time_minutes
                );

                // trackBookingLink.href = `/track/${data.tracking_number}/`;
                trackBookingLink.href = `/`;

                // Hide the form and show confirmation
                bookingForm.classList.add("hidden");
                bookingConfirmation.classList.remove("hidden");

                bookingConfirmation.scrollIntoView({
                behavior: "smooth",
                block: "start",
                });

                sessionStorage.removeItem("easygo_quote");

            // window.location.href = `/booking/${data.id}/payment/`;
            } catch (error) {
                showBookingError(error.message);
            } finally {
                setBookingLoading(false);
            }
        });


        const trackBookingButton = document.getElementById("track-booking-button");

        trackBookingButton.addEventListener("click", function () {
            const trackingNumber = document
                .getElementById("confirmation-tracking-number")
                .textContent
                .trim();

            if (!trackingNumber) {
                return;
            }

            // Navigate to the home page and pass the tracking number.
            window.location.href = `/#tracking`;
        });


        const copyTrackingButton = document.getElementById("copy-tracking-button");
        const copyTrackingButtonText = document.getElementById(
        "copy-tracking-button-text"
        );

        copyTrackingButton.addEventListener("click", async function () {
        const trackingNumber = confirmationTrackingNumber.textContent.trim();

        if (!trackingNumber) {
            return;
        }

        try {
            await navigator.clipboard.writeText(trackingNumber);

            copyTrackingButtonText.textContent = "Copied!";
            copyTrackingButton.classList.add("border-emerald-300", "bg-emerald-50", "text-emerald-700");

            setTimeout(function () {
            copyTrackingButtonText.textContent = "Copy";
            copyTrackingButton.classList.remove(
                "border-emerald-300",
                "bg-emerald-50",
                "text-emerald-700"
            );
            }, 2000);
        } catch (error) {
            copyTrackingButtonText.textContent = "Copy failed";

            setTimeout(function () {
            copyTrackingButtonText.textContent = "Copy";
            }, 2000);
        }
        });
        
    </script>
</body>
</html>

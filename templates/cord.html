<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SwiftDrop — Fast & Reliable Courier Delivery</title>
  <meta name="description" content="SwiftDrop delivers parcels, documents, and freight quickly and securely across cities and nationwide." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef6ff',
              100: '#d9ebff',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af',
              900: '#172554'
            }
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased">

    <section class="mx-auto max-w-xl px-4 py-16">

        <nav
            aria-label="Breadcrumb"
            class="border-b border-slate-200 bg-white mb-5"
            >
            <div class="max-w-7xl py-3">
                <ol class="flex items-center gap-2 text-sm">
                <li class="flex items-center gap-2">
                    <a
                    href="/"
                    class="flex items-center gap-1.5 font-medium text-slate-600 transition hover:text-brand-600"
                    >
                    <svg
                        class="h-4 w-4"
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                        aria-hidden="true"
                    >
                        <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"
                        />
                    </svg>
    
                    Home
                    </a>
                </li>
    
                <li aria-hidden="true" class="text-slate-400">
                    /
                </li>
    
                <li>
                    <span
                    aria-current="page"
                    class="font-semibold text-slate-900"
                    >
                    Update Location
                    </span>
                </li>
                </ol>
            </div>
        </nav>

        <h1 class="text-3xl font-extrabold text-slate-900">
            Update shipment location
        </h1>

        <form id="location-form" class="mt-8 space-y-5">
            <div>
            <label class="text-sm font-semibold text-slate-700">
                Tracking number
            </label>

            <input
                id="tracking-number"
                type="text"
                placeholder="EZ-A1B2C3D4"
                class="mt-1 w-full rounded-lg border border-slate-300 px-4 py-3"
            />
            </div>

            <div>
            <label class="text-sm font-semibold text-slate-700">
                Current location
            </label>

            <input
                id="location-name"
                type="text"
                placeholder="Ikorodu Road, Lagos, Nigeria"
                class="mt-1 w-full rounded-lg border border-slate-300 px-4 py-3"
            />
            </div>

            <button
            id="update-location-button"
            type="submit"
            class="w-full inline-flex items-center justify-center gap-3 rounded-xl bg-brand-600 px-6 py-4 font-semibold text-white transition hover:bg-brand-700 disabled:cursor-not-allowed disabled:opacity-70"
            >
            <svg
                id="location-spinner"
                class="hidden h-5 w-5 animate-spin"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
                />
                <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
                />
            </svg>

            <span id="location-button-text">Update location</span>
            </button>

            <p
            id="location-success"
            class="hidden rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm font-semibold text-emerald-700"
            ></p>

            <p
            id="location-error"
            class="hidden rounded-xl border border-red-200 bg-red-50 p-4 text-sm font-medium text-red-700"
            ></p>
        </form>
    </section>

    <script>
        const locationForm = document.getElementById("location-form");
        const locationButton = document.getElementById("update-location-button");
        const locationButtonText = document.getElementById("location-button-text");
        const locationSpinner = document.getElementById("location-spinner");
        const locationSuccess = document.getElementById("location-success");
        const locationError = document.getElementById("location-error");

        function setLocationLoading(isLoading) {
        locationButton.disabled = isLoading;
        locationButton.setAttribute("aria-busy", isLoading ? "true" : "false");

        locationSpinner.classList.toggle("hidden", !isLoading);

        locationButtonText.textContent = isLoading
            ? "Updating location..."
            : "Update location";
        }

        locationForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const trackingNumber = document
            .getElementById("tracking-number")
            .value
            .trim();

        const locationName = document
            .getElementById("location-name")
            .value
            .trim();

        locationSuccess.classList.add("hidden");
        locationError.classList.add("hidden");

        if (!trackingNumber || !locationName) {
            locationError.textContent =
            "Please enter both the tracking number and current location.";
            locationError.classList.remove("hidden");
            return;
        }

        setLocationLoading(true);

        try {
            const response = await fetch("/api/bookings/location/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json",
            },
            body: JSON.stringify({
                tracking_number: trackingNumber,
                location_name: locationName,
            }),
            });

            const data = await response.json();
            console.log(data)

            if (!response.ok) {
            throw new Error(
                data.error || "Unable to update the shipment location."
            );
            }

            locationSuccess.textContent =
            `Location updated: ${data.current_location.name}`;

            locationSuccess.classList.remove("hidden");

            locationForm.reset();
        } catch (error) {
            locationError.textContent = error.message;
            locationError.classList.remove("hidden");
        } finally {
            setLocationLoading(false);
        }
        });
    </script>

</body>
</html>
